# =============================================================================
# application-staging.yml — STAGING ENVIRONMENT
#
# Activated by: SPRING_PROFILES_ACTIVE=staging
#
# ALL sensitive values (DB password, API keys, secrets) are injected via
# environment variables at deployment time (ECS task definition / K8s secrets).
# This file contains only non-sensitive structural configuration.
#
# STAGING DISTINCTIONS FROM LOCAL:
#   - Flyway loads db/migration ONLY (no seed data)
#   - HikariCP pool size tuned for staging load
#   - BCrypt cost factor documented as MUST BE >= 12 (see BCryptConfig.java)
#   - SQL logging disabled (no sensitive query data in staging logs)
# =============================================================================

spring:

  # ── SMTP transport (Resend / Brevo / Postmark / SES-over-SMTP) ─────────────
  mail:
    host:     ${SMTP_HOST}
    port:     ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── Database — injected via environment variable ───────────────────────────
  #   Required env vars:
  #     DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
  datasource:
    url:      jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name:          InterviewEngine-Staging-Pool
      maximum-pool-size:  10   # match production: 10 per pod (PRD v2.1 §8)
      minimum-idle:       3

  # ── Flyway — staging uses versioned migrations ONLY ───────────────────────
  flyway:
    locations:
      - classpath:db/migration
    clean-disabled: true   # SAFETY: never allow flyway:clean against staging data

  # ── Spring AI ─────────────────────────────────────────────────────────────
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}

  # ── JPA ───────────────────────────────────────────────────────────────────
  jpa:
    show-sql: false

# =============================================================================
# Logging
# =============================================================================
logging:
  level:
    root:                   INFO
    com.interviewengine:        INFO
    org.flywaydb:           INFO
    org.hibernate.SQL:      WARN

# =============================================================================
# Application — staging configuration
# =============================================================================
app:
  security:
    jwt:
      # RSA keys injected as env vars — REQUIRED in staging.
      # Previously absent, which meant SecurityProperties generated an ephemeral
      # key pair on every boot and each deploy invalidated every live token.
      private-key-pem: ${APP_SECURITY_JWT_PRIVATE_KEY_PEM}
      public-key-pem:  ${APP_SECURITY_JWT_PUBLIC_KEY_PEM}
      access-token-expiration: 60m
      refresh-token-expiration: 7d
    invite:
      # HMAC secret — REQUIRED; ephemeral generation would invalidate live
      # invite links on every deploy.
      secret: ${APP_SECURITY_INVITE_SECRET}
      expiration: 72h
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS}

  frontend:
    base-url: ${APP_FRONTEND_BASE_URL}

  razorpay:
    key-id:     ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}

  storage:
    # Endpoint override selects the provider. Empty = AWS S3; set to the R2 /
    # GCS-interop / Spaces / MinIO endpoint to run anywhere else. Injected by the
    # workload Terraform module from the platform module's output contract.
    endpoint:    ${OBJECT_STORAGE_ENDPOINT:}
    region:      ${OBJECT_STORAGE_REGION:ap-south-1}
    bucket:      ${OBJECT_STORAGE_BUCKET}
    access-key:  ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key:  ${OBJECT_STORAGE_SECRET_KEY:}
    path-style-access: true
    use-local-stub: false

  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name:    ${MAIL_FROM_NAME:InterviewEngine}
    use-local-stub: false
