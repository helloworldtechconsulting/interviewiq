# =============================================================================
# application-web.yml — the WEB half of the web/worker split
#
# Activated by: SPRING_PROFILES_ACTIVE=<env>,web
#
# PRD v2.1, Implementation Architecture Decisions §4. Two Kubernetes Deployments
# are built from ONE image and distinguished only by Spring profile:
#
#   interviewiq-web     schedulers DISABLED  serves REST + WebSocket  HPA on request rate  min 2
#   interviewiq-worker  schedulers ENABLED   serves nothing           KEDA on queue depth  min 1
#
# "A @ConditionalOnProperty on the scheduler beans is the whole implementation."
#
# WHY THIS EXISTS: it delivers the workload isolation a message queue would have
# provided — an evaluation burst consumes worker CPU and cannot affect the pods
# serving live interviews. That was the one genuine benefit a broker was going to
# buy, and it comes here without a broker to run, upgrade, monitor and back up.
#
# Eviction protection and WebSocket reconnect-and-resume apply to THIS
# deployment. The worker holds no sockets and is freely evictable.
# =============================================================================

app:
  # Schedulers off. Evaluation, question generation, extraction, expiry and the
  # promo sweep all belong to the worker.
  schedulers:
    enabled: false

  room:
    timer-sweep:
      # ON here, and deliberately so — this is the one scheduled task that must
      # run on web pods. It drives sockets, and only the pod holding a
      # candidate's socket can push a timer warning to them.
      enabled: true

server:
  shutdown: graceful

spring:
  lifecycle:
    # Must exceed the longest interview (60 minutes at the Comprehensive tier)
    # so a rolling deploy waits for live interviews rather than cutting them off
    # mid-sentence. Pairs with terminationGracePeriodSeconds: 3900 on the
    # Deployment and the preStop call to /internal/drain.
    timeout-per-shutdown-phase: 65m

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
