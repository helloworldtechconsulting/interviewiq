# =============================================================================
# application-prod.yml — PRODUCTION ENVIRONMENT
#
# Activated by: SPRING_PROFILES_ACTIVE=prod
#
# PRODUCTION HARDENING vs STAGING:
#   - Flyway baseline-on-migrate = false; out-of-order = false (strict enforcement)
#   - Hibernate DDL = validate (schema owned exclusively by Flyway; Hibernate never alters)
#   - HikariCP pool tuned for production throughput
#   - Actuator endpoints restricted to health + prometheus only
#   - Stack traces NEVER exposed in API error responses
#   - BCrypt cost factor MUST BE >= 12 in BCryptConfig.java (WARNING: L1 in migration audit)
#   - SQL logging permanently disabled
#   - Server shutdown: graceful (30 s drain window for in-flight requests)
#
# ALL sensitive values are injected via environment variables.
# NEVER commit real credentials to this file.
# =============================================================================

spring:

  # ── SMTP transport (Resend / Brevo / Postmark / SES-over-SMTP) ─────────────
  mail:
    host:     ${SMTP_HOST}
    port:     ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── Database ───────────────────────────────────────────────────────────────
  datasource:
    url:      jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name:            InterviewEngine-Prod-Pool
      maximum-pool-size:    10   # PRD v2.1 §8 — 10 per pod; 6 web + 4 worker stays inside a small managed instance
      minimum-idle:         5
      idle-timeout:         600000   # 10 min
      max-lifetime:         1800000  # 30 min

  # ── Flyway ─────────────────────────────────────────────────────────────────
  flyway:
    locations:
      - classpath:db/migration
    # Strict settings — no baseline, no out-of-order in production
    baseline-on-migrate: false
    out-of-order:        false
    clean-disabled:      true   # SAFETY: destroy-all can never be triggered in prod

  # ── Spring AI ─────────────────────────────────────────────────────────────
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}

  # ── JPA ───────────────────────────────────────────────────────────────────
  jpa:
    show-sql: false

# =============================================================================
# Management — tighten actuator exposure in production
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never

# =============================================================================
# Server
# =============================================================================
server:
  shutdown: graceful
  lifecycle:
    timeout-per-shutdown-phase: 30s

# =============================================================================
# Logging — structured JSON output for log aggregation (CloudWatch/Datadog)
# =============================================================================
logging:
  level:
    root:                   WARN
    com.interviewengine:        INFO
    org.flywaydb:           INFO
    org.hibernate.SQL:      ERROR

# =============================================================================
# Application — production configuration
# =============================================================================
app:
  security:
    jwt:
      # RSA keys injected as env vars — REQUIRED in production
      private-key-pem: ${APP_SECURITY_JWT_PRIVATE_KEY_PEM}
      public-key-pem:  ${APP_SECURITY_JWT_PUBLIC_KEY_PEM}
      access-token-expiration: 60m
      refresh-token-expiration: 7d
    invite:
      # HMAC secret — REQUIRED in production; min 32 characters
      secret: ${APP_SECURITY_INVITE_SECRET}
      expiration: 72h
    cors:
      # Comma-separated exact origins, e.g. https://app.interviewengine.ai
      # REQUIRED — the SPA is served from a different origin than the API.
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS}

  frontend:
    # Every emailed link (invite, booking confirmation, password reset) is built
    # from this. REQUIRED in production — a wrong value silently emails dead links.
    base-url: ${APP_FRONTEND_BASE_URL}

  razorpay:
    key-id:     ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}

  storage:
    # Endpoint override selects the provider. Empty = AWS S3; set to the R2 /
    # GCS-interop / Spaces / MinIO endpoint to run anywhere else. Injected by the
    # workload Terraform module from the platform module's output contract.
    endpoint:    ${OBJECT_STORAGE_ENDPOINT:}
    region:      ${OBJECT_STORAGE_REGION:ap-south-1}
    bucket:      ${OBJECT_STORAGE_BUCKET}
    access-key:  ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key:  ${OBJECT_STORAGE_SECRET_KEY:}
    path-style-access: true
    use-local-stub: false

  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name:    ${MAIL_FROM_NAME:InterviewEngine}
    use-local-stub: false
