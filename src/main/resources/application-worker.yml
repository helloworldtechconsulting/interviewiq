# =============================================================================
# application-worker.yml — the WORKER half of the web/worker split
#
# Activated by: SPRING_PROFILES_ACTIVE=<env>,worker
#
# Runs every scheduled worker and serves no traffic. There is no Service in front
# of this Deployment; it reaches the database and the LLM providers and nothing
# reaches it.
#
# Scales on queue depth via the KEDA Postgres scaler — for example a count of
# evaluation_reports rows at generation_status = 'PENDING'. Portable, free, and
# no broker required (Implementation Architecture Decisions §3, §4).
#
# Every worker claims its work with SELECT ... FOR UPDATE SKIP LOCKED and an
# explicit batch limit (§7.9), so scaling this Deployment out adds throughput
# rather than duplicating it.
# =============================================================================

app:
  schedulers:
    enabled: true

  room:
    timer-sweep:
      # OFF: this deployment holds no WebSockets, so there are no timers for it
      # to drive. Leaving it on would sweep an always-empty registry.
      enabled: false

server:
  shutdown: graceful

spring:
  lifecycle:
    # Short compared with web. A worker's longest unit of work is one LLM call
    # of roughly 20 seconds, and anything it fails to finish is reclaimed by the
    # staleness sweep on another pod.
    timeout-per-shutdown-phase: 2m

  # Fewer connections than a web pod: this deployment runs a bounded number of
  # concurrent evaluations (app.worker.evaluation-concurrency), not a request
  # thread pool. Keeping it lean protects the shared connection budget —
  # 6 web x 10 + 4 worker x 6 stays inside a small managed instance's ~112.
  datasource:
    hikari:
      maximum-pool-size: 6
      minimum-idle: 2

management:
  endpoint:
    health:
      probes:
        enabled: true
