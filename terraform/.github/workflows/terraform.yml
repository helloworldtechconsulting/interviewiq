# =============================================================================
# Terraform CI — plan on PR, apply on merge
#
# Two environments on TWO DIFFERENT CLOUDS, which is the point (Arch v4.0 §6):
#
#   staging     Oracle Cloud (OKE, Always Free)   auto-apply on merge
#   production  Google Cloud (GKE, free zonal)    manual approval
#
# "Run staging on a different cloud from production. Portability that has never
# been exercised is a hope, not a property." Staging applying first means a
# change that breaks portability fails here, before production.
#
# Replaces the previous AWS-only pipeline, which assumed ECS and AWS_ROLE_ARN_*.
# =============================================================================

name: Terraform

on:
  push:
    branches: [master, main]
    paths: ["terraform/**"]
  pull_request:
    paths: ["terraform/**"]

permissions:
  contents: read
  id-token: write # OIDC — no static cloud keys in GitHub (Arch v4.0 §8)
  pull-requests: write

env:
  TF_VERSION: "1.9.8"

jobs:
  # ---------------------------------------------------------------------------
  # Validate every module and environment. Cheap, and it catches the class of
  # error that only surfaces at apply time otherwise.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - terraform/modules/workload
          - terraform/modules/edge
          - terraform/modules/platform/gcp
          - terraform/modules/platform/oci
          - terraform/envs/staging
          - terraform/envs/production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive ${{ matrix.dir }}

      - name: Validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # ---------------------------------------------------------------------------
  # Staging — Oracle Cloud
  # ---------------------------------------------------------------------------
  staging:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: terraform/envs/staging
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL_S3:   ${{ secrets.OCI_S3_ENDPOINT }}

      - name: Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_compartment_id:      ${{ secrets.OCI_COMPARTMENT_ID }}
          TF_VAR_availability_domain: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          TF_VAR_node_image_id:       ${{ secrets.OCI_NODE_IMAGE_ID }}
          TF_VAR_image:               ghcr.io/${{ github.repository }}:${{ github.sha }}
          TF_VAR_zone_name:           ${{ vars.ZONE_NAME }}
          TF_VAR_cloudflare_zone_id:  ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_ingress_ip:          ${{ vars.STAGING_INGRESS_IP }}
          TF_VAR_spa_origin_hostname: ${{ vars.STAGING_SPA_ORIGIN }}
          TF_VAR_r2_endpoint:         ${{ secrets.R2_ENDPOINT }}
          TF_VAR_r2_bucket:           ${{ vars.R2_BUCKET_STAGING }}
          TF_VAR_r2_access_key:       ${{ secrets.R2_ACCESS_KEY }}
          TF_VAR_r2_secret_key:       ${{ secrets.R2_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # Production — Google Cloud. Gated on staging having applied cleanly, which is
  # how the portability claim gets exercised before it matters.
  # ---------------------------------------------------------------------------
  production:
    needs: staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # requires manual approval in GitHub Environments
    defaults:
      run:
        working-directory: terraform/envs/production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_project_id:          ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_image:               ghcr.io/${{ github.repository }}:${{ github.sha }}
          TF_VAR_zone_name:           ${{ vars.ZONE_NAME }}
          TF_VAR_cloudflare_zone_id:  ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_ingress_ip:          ${{ vars.PROD_INGRESS_IP }}
          TF_VAR_spa_origin_hostname: ${{ vars.PROD_SPA_ORIGIN }}
          TF_VAR_r2_endpoint:         ${{ secrets.R2_ENDPOINT }}
          TF_VAR_r2_bucket:           ${{ vars.R2_BUCKET_PROD }}
          TF_VAR_r2_access_key:       ${{ secrets.R2_ACCESS_KEY }}
          TF_VAR_r2_secret_key:       ${{ secrets.R2_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
