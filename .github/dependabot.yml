# =============================================================================
# Dependabot — automated dependency updates
#
# Grouped rather than one PR per dependency. Ungrouped Dependabot on a Spring
# Boot project opens a dozen PRs a week, which is reliably worse than none:
# they get bulk-closed, and the security update sitting among them goes with
# them.
#
# Security updates are deliberately NOT grouped — those want to arrive alone
# and be obvious.
# =============================================================================

version: 2

updates:
  # ── Backend ───────────────────────────────────────────────────────────────
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
        # Spring Boot's dependency management moves these in lockstep; a PR
        # bumping one of them alone is usually a PR that does not build.
        update-types: ["minor", "patch"]
      aws-sdk:
        patterns:
          - "software.amazon.awssdk*"
        update-types: ["minor", "patch"]
      test-tooling:
        patterns:
          - "org.testcontainers*"
          - "org.mockito*"
          - "org.assertj*"
          - "org.junit*"
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades land as deliberate work, not as an inbox item. A Spring
      # Boot major is a migration guide, not a version bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Frontend ──────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types: ["minor", "patch"]
      build-tooling:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "typescript"
          - "tailwindcss"
        update-types: ["minor", "patch"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── The pipelines themselves ──────────────────────────────────────────────
  # Actions are pinned by major tag, and a compromised or abandoned action is
  # a supply-chain path straight into a workflow holding GHCR write and cloud
  # credentials.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
