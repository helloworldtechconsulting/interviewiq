# =============================================================================
# ci.yml — InterviewEngine backend continuous integration
#
#   test ──▶ dependency-scan ──▶ image ──▶ image-scan
#
# Deployment lives in cd.yml, which consumes the image this workflow publishes.
#
# ── Branch trigger ───────────────────────────────────────────────────────────
# This previously triggered on "main" and "develop". Neither branch exists in
# this repository — the default branch is master — so the workflow had never
# run once. Everything downstream of that (the test suite, the image build)
# was configuration that looked like coverage without being coverage.
# =============================================================================

name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/interviewengine-backend

jobs:

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # ./mvnw, not mvn. The wrapper pins the Maven version; the runner's
      # preinstalled `mvn` is whatever the image ships this month, which is a
      # difference between local and CI that nobody controls.
      #
      # No Postgres service container: the integration tests use Testcontainers
      # and start their own PostgreSQL 16, matching the managed version the PRD
      # specifies. The service container that used to be here ran Postgres 15
      # and nothing ever connected to it.
      - name: Build, test and verify
        run: ./mvnw verify -B
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_AI_OPENAI_API_KEY: ci-stub-key

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  # ── Dependency vulnerabilities ──────────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trivy in filesystem mode rather than OWASP dependency-check. Both find
      # vulnerable dependencies; this one does not need an NVD API key, does
      # not spend the first eight minutes of every cold run downloading the
      # CVE database, and covers the frontend's npm tree in the same pass.
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH
          # Report-only. A newly published CVE in a transitive dependency
          # would otherwise block an unrelated hotfix at the worst moment —
          # the findings still surface in the Security tab, which is where
          # they get triaged rather than reflexively worked around.
          exit-code: "0"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-deps.sarif
          category: dependencies

  # ── Image ───────────────────────────────────────────────────────────────────
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runner

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Image vulnerabilities ───────────────────────────────────────────────────
  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      # Scans the pushed image by digest, not by tag. A tag can move between
      # the build and this job; the digest is the artifact that will actually
      # be deployed, so it is the one worth knowing the CVEs of.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: container-image
