# =============================================================================
# ci.yml — InterviewIQ Backend CI/CD Pipeline
#
# Jobs
# ┌──────────┐     ┌──────────────┐     ┌───────────────┐
# │   test   │────▶│ docker-build │────▶│  docker-push  │
# └──────────┘     └──────────────┘     └───────────────┘
#
#  test          — compile + run the full test suite on every push and PR
#  docker-build  — build the Docker image to verify the Dockerfile is valid
#                  runs on every push to main; skipped on PRs from forks
#  docker-push   — push image to GitHub Container Registry (GHCR)
#                  runs only on push to main (not on PRs)
#
# Container registry
#   Images are pushed to GHCR:
#   ghcr.io/<owner>/<repo>/interviewiq-backend:<tag>
#
#   Tags applied automatically by docker/metadata-action:
#     • main        — latest commit on main branch
#     • sha-<hash>  — immutable per-commit tag (for rollbacks)
#
# Secrets required (Settings → Secrets → Actions)
#   None for CI (GHCR login uses the built-in GITHUB_TOKEN).
#   For deployment steps (not yet added), you would add:
#     DB_HOST, APP_SECURITY_JWT_PRIVATE_KEY_PEM, etc.
# =============================================================================

name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same branch when a new push arrives.
# Saves CI minutes during fast iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/interviewiq-backend

jobs:

  # ── Job 1: Test ─────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Start a Postgres service container so integration tests can connect.
    # Spring Boot unit tests (Mockito) don't need it, but if you add
    # @SpringBootTest / @DataJpaTest tests later, they'll find it at localhost:5432.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       interviewiq_test
          POSTGRES_USER:     interviewiq
          POSTGRES_PASSWORD: interviewiq_ci_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interviewiq -d interviewiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          # Cache the local Maven repository (.m2) between runs.
          # Cache key includes the pom.xml hash so it's busted on dependency changes.
          cache: maven

      - name: Run tests
        # `-Pintegration` activates the Failsafe profile so *IT.java run.
        # Selenium UI tests live behind the separate `selenium` profile and
        # are exercised by .github/workflows/test-report.yml when the full
        # docker-compose stack is up.
        run: mvn verify -Pintegration -B
        env:
          # Supply stub values so Spring context can start for @WebMvcTest slices.
          # Unit tests (TokenServiceTest, WalletServiceTest, etc.) don't need a DB;
          # the service container above covers future @DataJpaTest tests.
          SPRING_PROFILES_ACTIVE: local
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/interviewiq_test
          SPRING_DATASOURCE_USERNAME: interviewiq
          SPRING_DATASOURCE_PASSWORD: interviewiq_ci_secret
          # Stub AI / third-party keys — local profile already sets these to stubs
          SPRING_AI_OPENAI_API_KEY: ci-stub-key

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7


  # ── Job 2: Docker Build ──────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    # Only build the Docker image on pushes (not on PRs) to avoid leaking
    # registry credentials. PRs from forks don't have access to secrets.
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with branch name on every push (e.g. "main")
            type=ref,event=branch
            # Tag with short commit SHA for immutable rollback targets (e.g. "sha-a1b2c3d")
            type=sha,prefix=sha-,format=short
            # Tag as "latest" only when pushing to main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up subsequent builds.
          # The dependency layer (Stage 1) is almost always a cache hit.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Only build the final runner stage — skip re-exporting the builder
          target: runner

      - name: Summary
        run: |
          echo "### Docker Image Published :docker:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
