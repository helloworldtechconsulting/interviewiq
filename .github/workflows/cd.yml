# =============================================================================
# cd.yml — deploy to staging, then production (INTIQ-100)
#
#   CI succeeds on master
#        │
#        ▼
#   plan-staging ──▶ deploy-staging ──▶ smoke-staging
#                                            │
#                                            ▼
#                                    plan-production
#                                            │
#                                   [environment approval]
#                                            ▼
#                                    deploy-production ──▶ smoke-production
#
# ── Why Terraform apply rather than kubectl or Helm ──────────────────────────
#
# The Deployment, HPA, PodDisruptionBudget, ingress annotations and drain
# settings are all Terraform resources in modules/workload. Architecture v4.0
# §5.2 is explicit that the drain mechanisms "only work together" — a kubectl
# set-image deploy path would update the image while leaving those managed
# elsewhere, and the next terraform apply would revert whatever drifted. One
# owner for the cluster state, and it is Terraform.
#
# ── Cloud-agnostic, with one honest exception ────────────────────────────────
#
# Everything here operates on Terraform and GHCR, both cloud-neutral. The
# exception is the credential step: authenticating to a cluster is necessarily
# provider-specific. It is one step, isolated below, and swapping clouds means
# swapping it — which matches the Terraform layout, where the platform module
# is the only cloud-specific layer.
#
# ── Required configuration ───────────────────────────────────────────────────
#
# Secrets (repository level):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  federated OIDC provider resource name
#   GCP_SERVICE_ACCOUNT             deployer service account email
#   CLOUDFLARE_API_TOKEN            Cloudflare edge module (the provider reads
#                                   this from the environment; there is no
#                                   corresponding Terraform variable)
#   R2_ACCESS_KEY, R2_SECRET_KEY    object storage
#   GRAFANA_ADMIN_PASSWORD          monitoring stack admin login
#
# Variables (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_PROJECT_ID, GCP_REGION, GCP_ZONE
#   DNS_ZONE_NAME, CLOUDFLARE_ZONE_ID, INGRESS_IP, SPA_ORIGIN_HOSTNAME
#   R2_ENDPOINT, R2_BUCKET
#
# No long-lived JSON key. Workload Identity Federation trades the run's OIDC
# token for short-lived credentials, so a leaked log or a compromised action
# cannot yield a reusable cloud credential.
#
# Environments (Settings → Environments):
#   staging      no protection rules
#   production   required reviewers — this is the approval gate
# =============================================================================

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the commit that triggered CI)"
        required: false
        type: string

# One deployment at a time. Concurrent applies against the same Terraform state
# is how state locks get broken and half-applied infrastructure happens.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/interviewengine-backend
  TF_IN_AUTOMATION: "true"

jobs:

  # ── Resolve what to deploy ──────────────────────────────────────────────────
  resolve:
    name: Resolve Image
    runs-on: ubuntu-latest
    # Never deploy a red build. workflow_run fires on completion regardless of
    # outcome, so this condition is what makes the dependency meaningful.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      image: ${{ steps.pick.outputs.image }}

    steps:
      - name: Pick image reference
        id: pick
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.image_tag }}" ]; then
            tag="${{ inputs.image_tag }}"
          else
            # Match the sha-<short> tag CI applies. Deploying an immutable
            # per-commit tag rather than "latest" means a rollback is naming
            # an older tag, and means two deploys of "latest" minutes apart
            # cannot silently be different images.
            tag="sha-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
          fi
          echo "image=${REGISTRY}/${IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${REGISTRY}/${IMAGE_NAME}:${tag}"

  # ── Staging ─────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: resolve
    environment:
      name: staging
      url: https://app-staging.interviewengine.ai

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── The one cloud-specific step ──────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      # Terraform talks to the cluster with a bearer token from the google
      # provider and needs nothing further. The `kubectl rollout status` step
      # below is a separate client and does need a kubeconfig, which is what
      # this writes.
      - name: Get cluster credentials
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: |
          gcloud container clusters get-credentials "interviewengine-staging" \
            --zone "${{ vars.GCP_ZONE }}" --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/envs/staging
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: terraform/envs/staging
        run: terraform plan -input=false -out=tfplan
        env:
          # Non-secret values come from repository/environment `vars`, secrets
          # from `secrets`. Neither is a committed .tfvars file: *.tfvars is
          # gitignored precisely because it is where database passwords and
          # object-storage keys get typed.
          TF_VAR_image: ${{ needs.resolve.outputs.image }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_zone_name: ${{ vars.DNS_ZONE_NAME }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_ingress_ip: ${{ vars.INGRESS_IP }}
          TF_VAR_spa_origin_hostname: ${{ vars.SPA_ORIGIN_HOSTNAME }}
          TF_VAR_r2_endpoint: ${{ vars.R2_ENDPOINT }}
          TF_VAR_r2_bucket: ${{ vars.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_r2_access_key: ${{ secrets.R2_ACCESS_KEY }}
          TF_VAR_r2_secret_key: ${{ secrets.R2_SECRET_KEY }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      # Applies the saved plan, not a fresh one. Re-planning at apply time
      # would deploy whatever the world looks like now rather than what was
      # reviewed a moment ago.
      - name: Terraform apply
        working-directory: terraform/envs/staging
        run: terraform apply -input=false -auto-approve tfplan

      # Terraform reports success once the API server accepts the object. The
      # rollout is what actually has to succeed — a pod crash-looping on a bad
      # migration is a green apply and a broken environment.
      - name: Wait for rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/interviewengine-web \
            -n interviewengine --timeout=10m
          kubectl rollout status deployment/interviewengine-worker \
            -n interviewengine --timeout=10m

  smoke-staging:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: [resolve, deploy-staging]
    steps:
      # Deliberately thin: liveness, readiness, and one real request through
      # Cloudflare and the ingress. Enough to catch a broken image, a failed
      # migration, or a misrouted edge — which is most of what goes wrong at
      # deploy time. A deeper suite belongs in CI, against Testcontainers,
      # where it is not racing a rollout.
      - name: Probe health endpoints
        run: |
          set -euo pipefail
          base="https://api-staging.interviewengine.ai"

          for path in /actuator/health/liveness /actuator/health/readiness; do
            echo "GET ${base}${path}"
            status=$(curl -sS -o /tmp/body -w '%{http_code}' --retry 6 --retry-delay 10 \
                       --retry-all-errors --max-time 30 "${base}${path}")
            if [ "$status" != "200" ]; then
              echo "FAILED: ${path} returned ${status}"
              cat /tmp/body
              exit 1
            fi
          done

          # An unauthenticated request to an authenticated route must be
          # refused, not served. A 200 here would mean the security filter
          # chain did not engage.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${base}/api/v1/auth/me")
          if [ "$status" != "401" ] && [ "$status" != "403" ]; then
            echo "FAILED: /api/v1/auth/me returned ${status}, expected 401 or 403"
            exit 1
          fi
          echo "Smoke tests passed."

  # ── Production ──────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [resolve, smoke-staging]
    # The approval gate. GitHub holds this job until a required reviewer on the
    # production environment approves it — the same image, already exercised in
    # staging, waiting on a human.
    environment:
      name: production
      url: https://app.interviewengine.ai

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get cluster credentials
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: |
          gcloud container clusters get-credentials "interviewengine-production" \
            --zone "${{ vars.GCP_ZONE }}" --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/envs/production
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: terraform/envs/production
        run: terraform plan -input=false -out=tfplan
        env:
          # Non-secret values come from repository/environment `vars`, secrets
          # from `secrets`. Neither is a committed .tfvars file: *.tfvars is
          # gitignored precisely because it is where database passwords and
          # object-storage keys get typed.
          TF_VAR_image: ${{ needs.resolve.outputs.image }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_zone_name: ${{ vars.DNS_ZONE_NAME }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_ingress_ip: ${{ vars.INGRESS_IP }}
          TF_VAR_spa_origin_hostname: ${{ vars.SPA_ORIGIN_HOSTNAME }}
          TF_VAR_r2_endpoint: ${{ vars.R2_ENDPOINT }}
          TF_VAR_r2_bucket: ${{ vars.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_r2_access_key: ${{ secrets.R2_ACCESS_KEY }}
          TF_VAR_r2_secret_key: ${{ secrets.R2_SECRET_KEY }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      - name: Terraform apply
        working-directory: terraform/envs/production
        run: terraform apply -input=false -auto-approve tfplan

      # 15 minutes, not staging's 10. Production web pods carry live
      # interviews: maxUnavailable is 0 and terminationGracePeriodSeconds is
      # 3900, so a rollout waits for real conversations to finish rather than
      # cutting them off (Arch v4.0 §5.2). A rollout that looks slow here is
      # usually the drain working correctly.
      - name: Wait for rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/interviewengine-web \
            -n interviewengine --timeout=15m
          kubectl rollout status deployment/interviewengine-worker \
            -n interviewengine --timeout=15m

  smoke-production:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Probe health endpoints
        run: |
          set -euo pipefail
          base="https://api.interviewengine.ai"

          for path in /actuator/health/liveness /actuator/health/readiness; do
            echo "GET ${base}${path}"
            status=$(curl -sS -o /tmp/body -w '%{http_code}' --retry 6 --retry-delay 10 \
                       --retry-all-errors --max-time 30 "${base}${path}")
            if [ "$status" != "200" ]; then
              echo "FAILED: ${path} returned ${status}"
              cat /tmp/body
              exit 1
            fi
          done

          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${base}/api/v1/auth/me")
          if [ "$status" != "401" ] && [ "$status" != "403" ]; then
            echo "FAILED: /api/v1/auth/me returned ${status}, expected 401 or 403"
            exit 1
          fi
          echo "Smoke tests passed."

      # Rollback is deliberately manual and deliberately documented rather than
      # automated. An automatic rollback on a failed smoke test would, on a
      # deploy that included a Flyway migration, put the previous image in
      # front of a migrated schema — which is usually worse than the failure it
      # is reacting to. The operator decides.
      - name: Rollback instructions on failure
        if: failure()
        run: |
          {
            echo "### Production smoke test failed"
            echo
            echo "The new image is live and failing its health checks."
            echo
            echo "To roll back, re-run this workflow via workflow_dispatch with"
            echo "\`image_tag\` set to the previous \`sha-<short>\` tag."
            echo
            echo "**Check first whether this deploy included a Flyway migration.**"
            echo "If it did, rolling the image back leaves the old code in front"
            echo "of a migrated schema. Resolve the migration before reverting."
          } >> "$GITHUB_STEP_SUMMARY"
