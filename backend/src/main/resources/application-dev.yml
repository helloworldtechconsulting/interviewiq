spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/interviewiq_dev
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    root: INFO
    com.interviewiq: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  jwt:
    secret: dev-secret-key-change-in-production-64-chars-minimum-required
    expiry-minutes: 1440
    refresh-expiry-days: 30
    algorithm: HS256
    issuer: interviewiq-dev

  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:dev-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:dev-client-secret}

  gcs:
    project-id: ${GCS_PROJECT_ID:interviewiq-dev}
    bucket-name: ${GCS_BUCKET_NAME:interviewiq-dev-bucket}
    credentials-path: ${GCS_CREDENTIALS_PATH:}

  openai:
    api-key: ${OPENAI_API_KEY}
    model: gpt-4o
    temperature: 0.7
    max-tokens: 2000

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:test-key}
    key-secret: ${RAZORPAY_KEY_SECRET:test-secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:test-webhook}

  interview:
    invite-token-expiry-hours: 72
    cost-per-interview-paise: 10000
    max-questions: 12
    min-questions: 8

  email:
    from: dev@interviewiq.local
    sender-name: InterviewIQ Dev
    base-url: http://localhost:3000

springdoc:
  api-docs:
    path: /docs/api-docs
  swagger-ui:
    path: /docs/swagger-ui.html
    enabled: true
